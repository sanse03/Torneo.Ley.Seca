<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneo Americano · El Club Espinal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#FAFAFC; --ink:#0E1B4A; --card:#FFFFFF; --line:#E1E4EC;
    --accent:#D3E834; --accent-ink:#1A1F00; --court:#1B3A7A; --live:#E5533D; --ok:#1E8E5A;
    --muted:#667085; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;}
  h1,h2,h3,.num{font-family:'Space Grotesk','Inter',sans-serif;}
  h1{font-size:21px;font-weight:700;margin:0;line-height:1.2;}
  h2{font-size:17px;font-weight:600;margin:0 0 12px;}
  h3{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:600;}
  .wrap{max-width:900px;margin:0 auto;padding:16px;}
  header{position:sticky;top:0;background:var(--bg);z-index:10;padding:12px 16px 10px;border-bottom:1px solid var(--line);}
  header .row{display:flex;align-items:center;gap:12px;max-width:900px;margin:0 auto;}
  .logo{height:40px;width:auto;display:block;}
  .sub{color:var(--muted);font-size:13px;}
  nav{display:flex;gap:6px;margin:10px auto 0;overflow-x:auto;max-width:900px;}
  nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;}
  nav button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  section.tab{display:none;}
  section.tab.active{display:block;}
  .block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
  .btn{background:var(--court);color:#fff;border:none;border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;}
  .btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .btn.warn{background:var(--live);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .status{color:var(--muted);font-size:13px;margin-top:6px;}
  .err{color:var(--live);font-size:13px;margin-top:6px;}
  label.f{display:block;font-size:13px;font-weight:600;margin-bottom:4px;}
  input[type=text],input[type=number],select,input[type=time]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .addrow{display:flex;gap:8px;}
  .addrow input{flex:1;}
  .plist{list-style:none;margin:10px 0 0;padding:0;}
  .plist li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);}
  .plist li:first-child{border-top:none;}
  .plist .n{font-family:'Space Grotesk';font-weight:700;color:var(--muted);min-width:22px;}
  .plist input{flex:1;padding:7px 9px;}
  .x{border:none;background:none;color:var(--live);font-size:18px;cursor:pointer;padding:0 6px;}
  .estimate{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;}
  .estimate b{color:var(--accent);font-family:'Space Grotesk';}
  .turno{margin-bottom:16px;}
  .turno-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .turno-h .t{font-family:'Space Grotesk';font-weight:700;font-size:16px;}
  .turno-h .d{color:var(--muted);font-size:12px;}
  .courts{display:grid;grid-template-columns:repeat(var(--c,2),minmax(0,1fr));gap:10px;}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-width:0;}
  .pcard.live{border-color:var(--live);box-shadow:0 0 0 1px var(--live);}
  .pcard.done{background:#F6F7F9;}
  .pcard-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;}
  .prow .team{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .prow.win .team{color:var(--ok);}
  .prow input{width:46px;flex:none;text-align:center;padding:6px 2px;font-family:'Space Grotesk';font-weight:700;font-size:16px;}
  .prow input:disabled{background:#EEF0F3;color:var(--ink);}
  .pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .livebtn{border:1px solid var(--live);color:var(--live);background:none;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;}
  .livebtn.on{background:var(--live);color:#fff;}
  .lockbtn{border:none;background:var(--ink);color:#fff;border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer;}
  .lockbtn.on{background:var(--ok);}
  table.st{width:100%;border-collapse:collapse;font-size:14px;}
  table.st th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line);}
  table.st td{padding:9px 6px;border-bottom:1px solid var(--line);}
  table.st .num{text-align:center;font-variant-numeric:tabular-nums;}
  table.st tr.lead td{background:#F4F9D2;font-weight:700;}
  .crown{background:var(--ink);color:#fff;border-radius:var(--radius);padding:16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;}
  .crown .big{font-size:34px;}
  .crown .who{font-family:'Space Grotesk';font-weight:700;font-size:20px;color:var(--accent);}
  .progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px;}
  .progress div{height:100%;background:var(--court);}
  #gate{position:fixed;inset:0;background:var(--ink);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  #gate .box{background:#fff;border-radius:var(--radius);padding:22px;width:100%;max-width:340px;}
  #gate .box button{width:100%;margin-top:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
  .chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .chip .del{margin-left:6px;color:var(--muted);font-weight:400;}
  @media(max-width:520px){ .grid2{grid-template-columns:1fr;} .courts{grid-template-columns:1fr;} }

  .gtitle{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .gb{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--accent);font-family:'Space Grotesk';font-weight:700;font-size:14px;}
  .ph{color:var(--muted);font-style:italic;font-weight:500;}
  table.st tr.q td{background:#F4F9D2;}
  .groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
  .bracket-scroll{overflow-x:auto;padding:4px 2px 8px;}
  .bracket{display:flex;align-items:center;min-width:max-content;}
  .bnode{display:flex;align-items:center;}
  .bf{display:grid;grid-auto-rows:1fr;margin-right:22px;}
  .bw{position:relative;display:flex;justify-content:flex-end;align-items:center;padding:6px 0;}
  .bw::after{content:"";position:absolute;right:-22px;width:22px;border:0 solid var(--muted);}
  .bw.one::after{top:50%;border-top-width:2px;}
  .bw.up::after{top:50%;bottom:0;border-top-width:2px;border-right-width:2px;}
  .bw.down::after{top:0;bottom:50%;border-bottom-width:2px;border-right-width:2px;}
  .bm{width:190px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;}
  .bm.live{border-color:var(--live);}
  .bh{font-size:10.5px;color:var(--muted);margin-bottom:4px;}
  .br{display:flex;align-items:center;gap:6px;padding:3px 0;}
  .br+.br{border-top:1px solid var(--line);}
  .br.win .bnm{font-weight:700;color:var(--ok);}
  .bnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
  .bsc{font-family:'Space Grotesk';font-weight:700;min-width:12px;text-align:right;}
  .bchamp{margin-left:22px;text-align:center;width:110px;}
  .bchamp .trophy{font-size:34px;line-height:1;}
  .bchamp .cname{font-family:'Space Grotesk';font-weight:700;font-size:13px;margin-top:4px;}
</style>
</head>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAl3mtoAILvDECAF5XtYg2alPnNSP66Ri8",
  authDomain: "torneo-ley.firebaseapp.com",
  databaseURL: "https://torneo-ley-default-rtdb.firebaseio.com",
  projectId: "torneo-ley",
  storageBucket: "torneo-ley.firebasestorage.app",
  messagingSenderId: "202554467520",

};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
// Cada torneo usa su propio nodo. Para otro torneo: abrir con ?t=nombre (ej. ?t=americano-2026-11-09)
const TID = (new URLSearchParams(location.search).get("t") || "americano-2026-11-02").replace(/[.#$\[\]\/]/g,"-");
const ROOT = "americano/" + TID;
document.getElementById("sub").textContent = "El Club Espinal";

// ---------- ESTRUCTURA FIJA: 2 grupos de 5 · 20 partidos · cancha 1 = grupo A, cancha 2 = grupo B ----------
const GRUPOS = {A:5, B:5};
// [turno, cancha, grupo, i, j]  (i, j = posición dentro del grupo, 0-based)
const FIXTURE = [
  [1,1,"A",2,3],[1,2,"B",2,3],[2,1,"A",1,4],[2,2,"B",1,4],[3,1,"A",0,3],[3,2,"B",0,3],[4,1,"A",2,4],[4,2,"B",2,4],[5,1,"A",0,1],[5,2,"B",0,1],
  [6,1,"A",3,4],[6,2,"B",3,4],[7,1,"A",1,2],[7,2,"B",1,2],[8,1,"A",0,4],[8,2,"B",0,4],[9,1,"A",1,3],[9,2,"B",1,3],[10,1,"A",0,2],[10,2,"B",0,2]
];
function partidosIniciales(){
  const o={};
  FIXTURE.forEach(([t,c,g,i,j],k)=>{ o["m"+String(k+1).padStart(2,"0")]={numero:k+1,turno:t,cancha:c,g,i,j,sa:null,sb:null,locked:false,live:false}; });
  return o;
}

// ---------- TABS ----------
function showTab(t){
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("active",x.dataset.tab===t));
  document.querySelectorAll("section.tab").forEach(x=>x.classList.toggle("active",x.id==="tab-"+t));
}
document.querySelectorAll("#nav button").forEach(b=> b.onclick=()=>showTab(b.dataset.tab));

// ---------- ESTADO ----------
let NOMBRES={}, CFG={}, PARTIDOS={}, ELIM={}, LOADED={n:false,c:false,m:false,e:false}, seeded=false;
db.ref(ROOT+"/eliminatoria").on("value",s=>{ ELIM=s.val()||{}; LOADED.e=true; renderAll(); });
db.ref(ROOT+"/nombres").on("value",s=>{ NOMBRES=s.val()||{}; LOADED.n=true; renderAll(); });
db.ref(ROOT+"/config").on("value",s=>{ CFG=s.val()||{}; LOADED.c=true; renderAll(); });
db.ref(ROOT+"/partidos").on("value",s=>{ PARTIDOS=s.val()||{}; LOADED.m=true; renderAll(); });
let first=true;
function renderAll(){
  if(!(LOADED.n&&LOADED.c&&LOADED.m&&LOADED.e)) return;
  if(!Object.keys(PARTIDOS).length && !seeded){ seeded=true; db.ref(ROOT+"/partidos").set(partidosIniciales()); return; }
  if(first){ first=false; fillCfg(); }
  renderPartidos(); renderGrupos(); syncElim(); renderElim(); renderParejas();
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const nombre=(g,i)=>{ const v=(NOMBRES[g]||{})[i]; return (v&&String(v).trim()) ? String(v).trim() : null; };
const etiqueta=(g,i)=> nombre(g,i) || `Pareja ${g}${i+1}`;
const hayMarcadores=()=>Object.values(PARTIDOS).some(p=>p.locked);

// ---------- MARCADOR ----------
function marcadorValido(a,b,G){
  if(a===""||b===""||a==null||b==null) return false;
  a=+a; b=+b;
  if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a===b) return false;
  if(!G) return true;
  const mx=Math.max(a,b), mn=Math.min(a,b);
  return (mx===G && mn<=G-2) || (mx===G+1 && (mn===G-1||mn===G));
}
const gamesCfg=()=> CFG.games==null ? 6 : +CFG.games;
function msgMarcador(G){
  return G ? `Marcador no válido. A ${G} games: ${G}-0 a ${G}-${G-2}, ${G+1}-${G-1} o ${G+1}-${G}. No puede haber empate.` : "Marcador no válido: no puede haber empate.";
}
function horaTurno(t){
  const [h,m]=(CFG.inicio||"21:30").split(":").map(Number);
  const x=h*60+m+(t-1)*(+CFG.minutos||25);
  const hh=Math.floor(x/60)%24, mm=x%60, ap=hh>=12?"PM":"AM", h12=((hh+11)%12)+1;
  return `${h12}:${String(mm).padStart(2,"0")} ${ap}`;
}

// ---------- PARTIDOS ----------
function renderPartidos(){
  const el=document.getElementById("partidos");
  const arr=Object.entries(PARTIDOS).map(([id,p])=>({...p,id})).sort((x,y)=>x.numero-y.numero);
  const hechos=arr.filter(p=>p.locked).length;
  let html=`<div class="block"><div style="display:flex;justify-content:space-between;font-size:13px;"><b>${hechos} de ${arr.length} partidos jugados</b><span class="status" style="margin:0">Cancha 1: grupo A · Cancha 2: grupo B</span></div><div class="progress"><div style="width:${arr.length?hechos*100/arr.length:0}%"></div></div></div>`;
  const maxT=Math.max(...arr.map(p=>p.turno));
  for(let t=1;t<=maxT;t++){
    const ms=arr.filter(p=>p.turno===t).sort((x,y)=>x.cancha-y.cancha);
    html+=`<div class="turno"><div class="turno-h"><span class="t">Turno ${t} · ${horaTurno(t)}</span></div><div class="courts" style="--c:2">`;
    ms.forEach(p=>{
      const aw=p.locked&&+p.sa>+p.sb, bw=p.locked&&+p.sb>+p.sa;
      const nA=nombre(p.g,p.i), nB=nombre(p.g,p.j);
      html+=`<div class="pcard ${p.live?'live':''} ${p.locked?'done':''}" data-id="${p.id}">
        <div class="pcard-top"><span>#${p.numero} · Grupo ${p.g} · Cancha ${p.cancha}</span><span>${p.locked?'Finalizado':''}</span></div>
        <div class="prow ${aw?'win':''}"><span class="team ${nA?'':'ph'}">${esc(etiqueta(p.g,p.i))}</span><input type="number" inputmode="numeric" min="0" max="9" value="${p.sa??''}" data-r="sa" ${p.locked?'disabled':''}></div>
        <div class="prow ${bw?'win':''}"><span class="team ${nB?'':'ph'}">${esc(etiqueta(p.g,p.j))}</span><input type="number" inputmode="numeric" min="0" max="9" value="${p.sb??''}" data-r="sb" ${p.locked?'disabled':''}></div>
        <div class="pfoot"><button class="livebtn ${p.live?'on':''}" data-r="live">${p.live?'EN VIVO':'En vivo'}</button><button class="lockbtn ${p.locked?'on':''}" data-r="lock">${p.locked?'🔒':'🔓 Guardar'}</button></div>
      </div>`;
    });
    html+=`</div></div>`;
  }
  el.innerHTML=html;
  el.querySelectorAll(".pcard").forEach(card=>{
    const id=card.dataset.id, p=PARTIDOS[id];
    card.querySelector('[data-r=live]').onclick=()=> db.ref(`${ROOT}/partidos/${id}/live`).set(!p.live);
    card.querySelector('[data-r=lock]').onclick=()=>{
      if(p.locked){ if(confirm("¿Desbloquear este marcador para corregirlo?")) db.ref(`${ROOT}/partidos/${id}/locked`).set(false); return; }
      const a=card.querySelector('[data-r=sa]').value, b=card.querySelector('[data-r=sb]').value;
      if(!marcadorValido(a,b,gamesCfg())){ alert(msgMarcador(gamesCfg())); return; }
      db.ref(`${ROOT}/partidos/${id}`).update({sa:+a,sb:+b,locked:true,live:false});
    };
  });
}

// ---------- POSICIONES ----------
// Desempate: partidos ganados, diferencia de sets, diferencia de games, games a favor, enfrentamiento directo, sorteo.
function posiciones(g){
  const n=GRUPOS[g], st=[...Array(n).keys()].map(i=>({i,pj:0,pg:0,pp:0,gf:0,gc:0}));
  const ms=Object.values(PARTIDOS).filter(p=>p.g===g);
  ms.forEach(p=>{
    if(!p.locked) return;
    const A=st[p.i], B=st[p.j];
    A.pj++; B.pj++; A.gf+=+p.sa; A.gc+=+p.sb; B.gf+=+p.sb; B.gc+=+p.sa;
    if(+p.sa>+p.sb){A.pg++;B.pp++;} else {B.pg++;A.pp++;}
  });
  st.forEach(s=>{ s.dif=s.gf-s.gc; s.ds=s.pg-s.pp; });
  const h2h=(x,y)=>{ const m=ms.find(p=>p.locked&&((p.i===x&&p.j===y)||(p.i===y&&p.j===x))); if(!m) return 0; const xw=(m.i===x)?(+m.sa>+m.sb):(+m.sb>+m.sa); return xw?-1:1; };
  st.sort((x,y)=> y.pg-x.pg || y.ds-x.ds || y.dif-x.dif || y.gf-x.gf || h2h(x.i,y.i) || x.i-y.i);
  return {st, completo: ms.length===n*(n-1)/2 && ms.every(p=>p.locked)};
}
function renderGrupos(){
  const el=document.getElementById("grupos");
  let html='<div class="groups">';
  Object.keys(GRUPOS).forEach(g=>{
    const {st,completo}=posiciones(g);
    html+=`<div class="block"><div class="gtitle"><span class="gb">${g}</span><h2 style="margin:0">Grupo ${g}</h2></div><table class="st"><thead><tr><th>#</th><th>Pareja</th><th class="num">PJ</th><th class="num">PG</th><th class="num">Dif</th><th class="num">GF</th></tr></thead><tbody>`;
    st.forEach((s,k)=>{
      html+=`<tr class="${k<3&&s.pj>0?'q':''}"><td>${k+1}</td><td class="${nombre(g,s.i)?'':'ph'}">${esc(etiqueta(g,s.i))}</td><td class="num">${s.pj}</td><td class="num"><b>${s.pg}</b></td><td class="num">${s.dif>0?'+':''}${s.dif}</td><td class="num">${s.gf}</td></tr>`;
    });
    html+=`</tbody></table><div class="status">${completo?'Grupo terminado.':'Posiciones provisionales.'}</div></div>`;
  });
  html+='</div><div class="status">Clasifican los 3 primeros de cada grupo (resaltados). Orden: partidos ganados, diferencia de sets, diferencia de games, games a favor, enfrentamiento directo. Si el empate sigue, se define por sorteo.</div>';
  el.innerHTML=html;
}

// ---------- PAREJAS (escribir / editar nombres) ----------
function renderParejas(){
  const el=document.getElementById("parejas");
  if(el.contains(document.activeElement)) return; // no interrumpir mientras se escribe
  let html='<div class="block"><h2>Nombres de las parejas</h2><p class="status" style="margin:0 0 6px;">Escribe o corrige el nombre de cada pareja. Se guarda al salir del campo. Los partidos y marcadores se mantienen.</p></div><div class="groups">';
  Object.keys(GRUPOS).forEach(g=>{
    html+=`<div class="block"><div class="gtitle"><span class="gb">${g}</span><h2 style="margin:0">Grupo ${g}</h2></div><ul class="plist">`;
    for(let i=0;i<GRUPOS[g];i++){
      html+=`<li><span class="n">${i+1}</span><input type="text" id="n-${g}${i}" data-g="${g}" data-i="${i}" value="${esc(nombre(g,i)||'')}" placeholder="Ej: Juan / Pedro" autocomplete="off" aria-label="Pareja ${g}${i+1}"></li>`;
    }
    html+='</ul></div>';
  });
  html+='</div>';
  el.innerHTML=html;
  el.querySelectorAll("input").forEach(inp=>{
    const save=()=> db.ref(`${ROOT}/nombres/${inp.dataset.g}/${inp.dataset.i}`).set(inp.value.trim()||null);
    inp.addEventListener("change",save);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ inp.blur(); } });
  });
}

// ---------- ELIMINATORIA ----------
// Clasifican 1°, 2° y 3° de cada grupo. Los primeros van directo a semifinal.
// Cuartos: 2°A vs 3°B y 2°B vs 3°A. Semis: 1°A vs ganador (2°B-3°A) y 1°B vs ganador (2°A-3°B). Final.
const KO_DEF = {
  q1:{numero:21,turno:11,cancha:1,ronda:"Cuartos"},
  q2:{numero:22,turno:11,cancha:2,ronda:"Cuartos"},
  s1:{numero:23,turno:12,cancha:1,ronda:"Semifinal"},
  s2:{numero:24,turno:12,cancha:2,ronda:"Semifinal"},
  f :{numero:25,turno:13,cancha:1,ronda:"Final"}
};
const ref=(g,i)=> g+i;                       // "A0" = grupo A, posición 0
const refName=r=> r ? etiqueta(r[0], +r.slice(1)) : null;
function clasificados(){
  const A=posiciones("A").st, B=posiciones("B").st;
  return {A1:ref("A",A[0].i),A2:ref("A",A[1].i),A3:ref("A",A[2].i),B1:ref("B",B[0].i),B2:ref("B",B[1].i),B3:ref("B",B[2].i)};
}
function cuadroDesde(c){
  const mk=(k,ta,tb)=>({...KO_DEF[k],ta:ta||null,tb:tb||null,sa:null,sb:null,locked:false,live:false});
  return {q1:mk("q1",c.A2,c.B3), q2:mk("q2",c.B2,c.A3), s1:mk("s1",c.A1,null), s2:mk("s2",c.B1,null), f:mk("f",null,null)};
}
const gruposTerminados=()=>{ const a=Object.values(PARTIDOS); return a.length===20 && a.every(p=>p.locked); };
const elimConResultados=()=> ELIM.partidos && Object.values(ELIM.partidos).some(p=>p.locked);
let freezing=false;
function syncElim(){
  // Se confirma sola al terminar los 20 partidos de grupos; se re-sincroniza si se corrige un resultado de grupos
  // mientras no haya marcadores de eliminatoria.
  if(!gruposTerminados() || freezing) return;
  const c=clasificados(), clave=JSON.stringify(c);
  if(ELIM.clave===clave || elimConResultados()) return;
  freezing=true;
  db.ref(ROOT+"/eliminatoria").set({clave, partidos:cuadroDesde(c)}).then(()=>{ freezing=false; });
}
function vistaElim(){
  if(ELIM.partidos) return {conf:true, P:ELIM.partidos};
  return {conf:false, P:cuadroDesde(clasificados())};
}
const ganador=m=> (m&&m.locked&&m.sa!=null&&m.sb!=null) ? ((+m.sa>+m.sb)?m.ta:m.tb) : null;
function propagar(){
  db.ref(ROOT+"/eliminatoria/partidos").once("value").then(s=>{
    const P=s.val(); if(!P) return;
    const up={};
    const put=(k,f,v)=>{ const m=P[k]; if(!m||m.locked||!v||m[f]===v) return; up[`${k}/${f}`]=v; };
    put("s1","tb",ganador(P.q2)); put("s2","tb",ganador(P.q1));
    put("f","ta",ganador(P.s1)); put("f","tb",ganador(P.s2));
    if(Object.keys(up).length) db.ref(ROOT+"/eliminatoria/partidos").update(up);
  });
}
function renderElim(){
  const el=document.getElementById("elim");
  const {conf,P}=vistaElim();
  const hechos=Object.values(PARTIDOS).filter(p=>p.locked).length;
  const ph={q1:["2° Grupo A","3° Grupo B"],q2:["2° Grupo B","3° Grupo A"],s1:["1° Grupo A","Ganador #22"],s2:["1° Grupo B","Ganador #21"],f:["Ganador #23","Ganador #24"]};
  const nm=(k,side)=>{ const r=P[k][side==="a"?"ta":"tb"]; return r ? `<span class="bnm">${esc(refName(r))}</span>` : `<span class="bnm ph">${ph[k][side==="a"?0:1]}</span>`; };
  const bcard=k=>{ const m=P[k]; const aw=m.locked&&+m.sa>+m.sb, bw=m.locked&&+m.sb>+m.sa;
    return `<div class="bm ${m.live?'live':''}"><div class="bh">#${m.numero} · ${m.ronda} · ${horaTurno(m.turno)} · C${m.cancha}</div>
      <div class="br ${aw?'win':''}">${nm(k,"a")}<span class="bsc">${m.sa??''}</span></div>
      <div class="br ${bw?'win':''}">${nm(k,"b")}<span class="bsc">${m.sb??''}</span></div></div>`; };
  const node=(card,feeders)=>`<div class="bnode">${feeders&&feeders.length?`<div class="bf">${feeders.map((f,i)=>`<div class="bw ${feeders.length===1?'one':(i===0?'up':'down')}">${f}</div>`).join('')}</div>`:''}<div class="bc">${card}</div></div>`;
  const s1=node(bcard("s1"),[node(bcard("q2"))]), s2=node(bcard("s2"),[node(bcard("q1"))]);
  const fin=node(bcard("f"),[s1,s2]);
  const camp=ganador(P.f);
  let html=`<div class="status" style="margin-bottom:10px;">${conf?'Eliminatoria confirmada con los resultados de los grupos.':`Proyección con las posiciones actuales (${hechos} de 20 partidos de grupos jugados). Se confirma sola al terminar los grupos.`}</div>`;
  html+=`<div class="block"><h2>Cuadro</h2><div class="bracket-scroll"><div class="bracket">${fin}<div class="bchamp"><div class="trophy">🏆</div><div class="cname ${camp?'':'ph'}">${camp?esc(refName(camp)):'Campeón'}</div></div></div></div></div>`;
  // tarjetas de marcador
  [["Cuartos de final",["q1","q2"]],["Semifinal",["s1","s2"]],["Final",["f"]]].forEach(([tit,ks])=>{
    html+=`<div class="turno"><div class="turno-h"><span class="t">${tit} · ${horaTurno(P[ks[0]].turno)}</span></div><div class="courts" style="--c:2">`;
    ks.forEach(k=>{
      const m=P[k], listo=conf&&m.ta&&m.tb, aw=m.locked&&+m.sa>+m.sb, bw=m.locked&&+m.sb>+m.sa;
      const na=m.ta?esc(refName(m.ta)):`<span class="ph">${ph[k][0]}</span>`, nb=m.tb?esc(refName(m.tb)):`<span class="ph">${ph[k][1]}</span>`;
      html+=`<div class="pcard ${m.live?'live':''} ${m.locked?'done':''}" data-k="${k}">
        <div class="pcard-top"><span>#${m.numero} · Cancha ${m.cancha}</span><span>${m.locked?'Finalizado':''}</span></div>
        <div class="prow ${aw?'win':''}"><span class="team">${na}</span><input type="number" inputmode="numeric" min="0" max="9" value="${m.sa??''}" data-r="sa" ${m.locked||!listo?'disabled':''}></div>
        <div class="prow ${bw?'win':''}"><span class="team">${nb}</span><input type="number" inputmode="numeric" min="0" max="9" value="${m.sb??''}" data-r="sb" ${m.locked||!listo?'disabled':''}></div>
        <div class="pfoot"><button class="livebtn ${m.live?'on':''}" data-r="live" ${listo?'':'disabled'}>${m.live?'EN VIVO':'En vivo'}</button><button class="lockbtn ${m.locked?'on':''}" data-r="lock" ${listo?'':'disabled'}>${m.locked?'🔒':'🔓 Guardar'}</button></div>
      </div>`;
    });
    if(ks.length===1) html+='<div></div>';
    html+=`</div></div>`;
  });
  if(!conf) html+=`<div class="status">Los marcadores de eliminatoria se habilitan al terminar los 20 partidos de grupos.</div>`;
  el.innerHTML=html;
  if(!conf) return;
  el.querySelectorAll(".pcard").forEach(card=>{
    const k=card.dataset.k, m=ELIM.partidos[k]; if(!m.ta||!m.tb) return;
    card.querySelector('[data-r=live]').onclick=()=> db.ref(`${ROOT}/eliminatoria/partidos/${k}/live`).set(!m.live);
    card.querySelector('[data-r=lock]').onclick=()=>{
      if(m.locked){ if(confirm("¿Desbloquear este marcador para corregirlo?")) db.ref(`${ROOT}/eliminatoria/partidos/${k}/locked`).set(false); return; }
      const a=card.querySelector('[data-r=sa]').value, b=card.querySelector('[data-r=sb]').value;
      if(!marcadorValido(a,b,gamesCfg())){ alert(msgMarcador(gamesCfg())); return; }
      db.ref(`${ROOT}/eliminatoria/partidos/${k}`).update({sa:+a,sb:+b,locked:true,live:false}).then(()=>propagar());
    };
  });
}

// ---------- AJUSTES ----------
function fillCfg(){
  if(CFG.inicio) document.getElementById("cfg-inicio").value=CFG.inicio;
  if(CFG.minutos) document.getElementById("cfg-min").value=CFG.minutos;
  if(CFG.games!=null) document.getElementById("cfg-games").value=CFG.games;
}
document.getElementById("guardar-cfg").onclick=()=>{
  const c={inicio:document.getElementById("cfg-inicio").value||"21:30", minutos:Math.max(5,+document.getElementById("cfg-min").value||25), games:+document.getElementById("cfg-games").value};
  db.ref(ROOT+"/config").set(c).then(()=>{ document.getElementById("cfg-status").textContent="Guardado."; });
};
document.getElementById("sortear").onclick=()=>{
  if(hayMarcadores()){ alert("Ya hay marcadores guardados: no se pueden sortear los grupos."); return; }
  const todos=[]; Object.keys(GRUPOS).forEach(g=>{ for(let i=0;i<GRUPOS[g];i++){ const n=nombre(g,i); if(n) todos.push(n); } });
  if(todos.length<2){ alert("Escribe primero los nombres de las parejas en la pestaña Parejas."); return; }
  if(!confirm(`¿Sortear ${todos.length} parejas entre los grupos A y B?`)) return;
  for(let i=todos.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [todos[i],todos[j]]=[todos[j],todos[i]]; }
  const out={}; let k=0;
  Object.keys(GRUPOS).forEach(g=>{ out[g]={}; for(let i=0;i<GRUPOS[g];i++){ out[g][i]=todos[k++]||null; } });
  db.ref(ROOT+"/nombres").set(out); showTab("grupos");
};
document.getElementById("reset").onclick=()=>{
  if(!confirm("¿Borrar nombres y marcadores de este torneo?")) return;
  if(!confirm("Confirma de nuevo: esto no se puede deshacer.")) return;
  seeded=false; freezing=false; db.ref(ROOT).set(null);
};
</script>
</body>
</html>
