<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Torneo 12 Parejas · El Club Espinal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10211a;
    --surface:#17281f;
    --surface-2:#1e332a;
    --line:#2a4436;
    --text:#eff5ef;
    --text-dim:#9fb6a8;
    --accent:#d7f26d;
    --accent-ink:#16240f;
    --live:#ff5c5c;
    --groupA:#5b8def;
    --groupB:#e8a33d;
    --groupC:#d2668a;
    --groupD:#9b7bd4;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:56px;
  }
  h1,h2,h3,.display{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em;}
  .tabular{font-variant-numeric:tabular-nums;}

  header.top{
    padding:22px 16px 14px;
    border-bottom:1px solid var(--line);
    position:sticky;top:0;
    background:linear-gradient(180deg,var(--bg) 80%,transparent);
    backdrop-filter:blur(6px);
    z-index:20;
  }
  header.top h1{font-size:30px;margin:0 0 2px;color:var(--accent);line-height:1;}
  header.top p{margin:0;color:var(--text-dim);font-size:13px;}

  nav.tabs{
    display:flex;gap:4px;margin-top:14px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:4px;
  }
  nav.tabs button{
    flex:1;border:none;background:transparent;color:var(--text-dim);
    font-family:'Manrope',sans-serif;font-weight:700;font-size:12.5px;
    padding:9px 4px;border-radius:999px;cursor:pointer;
    transition:background .15s, color .15s;
  }
  nav.tabs button.active{background:var(--accent);color:var(--accent-ink);}

  main{max-width:820px;margin:0 auto;padding:16px;}
  .view{display:none;}
  .view.active{display:block;}

  .block-title{
    display:flex;align-items:baseline;gap:8px;margin:22px 0 10px;
  }
  .block-title:first-child{margin-top:2px;}
  .block-title h2{font-size:22px;margin:0;color:var(--text);}
  .block-title span{color:var(--text-dim);font-size:12.5px;}

  .schedule-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px 4px;}
  .schedule-inner{min-width:520px;}
  .court-header{display:grid;grid-template-columns:46px 1fr 1fr;gap:8px;padding:0 1px;margin-bottom:6px;}
  .court-header .ch-label{
    display:flex;align-items:center;gap:6px;color:var(--text-dim);
    font-size:11px;font-weight:800;letter-spacing:.04em;
  }
  .court-header .ch-label::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--accent);flex-shrink:0;}
  .slot-row{
    display:grid;grid-template-columns:46px 1fr 1fr;gap:8px;margin-bottom:10px;align-items:stretch;
  }
  .slot-time{
    display:flex;flex-direction:column;align-items:center;
    justify-content:center;color:var(--text-dim);font-size:11.5px;font-weight:700;
    border-right:1px dashed var(--line);
  }
  .slot-time b{color:var(--text);font-size:13px;}

  .match{
    flex:1;min-width:230px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:10px 12px;position:relative;overflow:hidden;
  }
  .match::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--gcolor,var(--accent));
  }
  .match.live{box-shadow:0 0 0 1px var(--live) inset;}
  .match-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .match-head .tag{
    font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--gcolor,var(--accent));
    display:flex;align-items:center;gap:5px;
  }
  .match-head .court{color:var(--text-dim);font-size:10.5px;}
  .live-btn{
    border:1px solid var(--line);background:var(--surface-2);color:var(--text-dim);
    font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:999px;cursor:pointer;
  }
  .live-btn.on{background:var(--live);border-color:var(--live);color:#fff;}
  .live-btn.on::before{content:'● ';}

  .teams{display:flex;flex-direction:column;gap:6px;}
  .team-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .team-row .name{font-size:13.5px;font-weight:600;line-height:1.25;}
  .team-row.winner .name{color:var(--accent);}
  .score-box{
    width:38px;height:34px;border-radius:7px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--text);font-family:'Bebas Neue',sans-serif;
    font-size:19px;text-align:center;
  }
  .score-box:disabled{opacity:.9;background:transparent;border-color:transparent;color:var(--text);}
  .score-display{
    width:38px;height:34px;display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue',sans-serif;font-size:19px;color:var(--text-dim);
  }
  .match-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px;}
  .btn{
    border:none;border-radius:7px;font-weight:800;font-size:11px;padding:6px 10px;cursor:pointer;
  }
  .btn-edit{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--line);}
  .btn-save{background:var(--accent);color:var(--accent-ink);}

  .group-block{margin-bottom:20px;}
  .group-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .group-dot{width:12px;height:12px;border-radius:3px;background:var(--gcolor);}
  .group-head h3{font-size:19px;margin:0;color:var(--text);}
  table.standings{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  table.standings th,table.standings td{padding:8px 8px;font-size:12.5px;text-align:center;border-bottom:1px solid var(--line);}
  table.standings th{color:var(--text-dim);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;}
  table.standings td.name{text-align:left;font-weight:700;}
  table.standings tr:last-child td{border-bottom:none;}
  table.standings tr.qualify td.name{color:var(--accent);}
  table.standings tr.qualify td.name::after{content:' ✓';color:var(--accent);}
  .tie-warning{
    margin-top:8px;background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.35);
    color:#ffb0b0;font-size:12px;padding:8px 10px;border-radius:8px;
  }
  .manual-order{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .manual-order select{
    background:var(--surface-2);color:var(--text);border:1px solid var(--line);
    border-radius:6px;font-size:12px;padding:4px 6px;
  }
  .manual-order button{font-size:11px;}

  .stage-title{margin:22px 0 10px;}
  .stage-title h3{margin:0;font-size:18px;color:var(--text-dim);}
  .bracket-col{display:flex;flex-direction:column;gap:10px;}

  .pay-summary{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:16px;
  }
  .pay-summary .num{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--accent);}
  .pay-group{margin-bottom:16px;}
  .pay-group h3{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:7px;}
  .pay-list{display:flex;flex-direction:column;gap:6px;}
  .pay-row{
    display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;
  }
  .pay-row input{width:18px;height:18px;accent-color:var(--accent);}
  .pay-row span{font-size:13.5px;font-weight:600;}
  .pay-row.paid{background:rgba(215,242,109,.07);border-color:rgba(215,242,109,.3);}
  .pay-row.paid span{color:var(--accent);}
  .team-of{color:var(--text-dim);font-weight:400 !important;font-size:11.5px !important;}

  .note{color:var(--text-dim);font-size:12px;margin:14px 0;line-height:1.5;}

  @media (max-width:480px){
    .match{min-width:0;padding:8px 9px;}
    .team-row .name{font-size:12.5px;}
    .score-box,.score-display{width:32px;height:30px;font-size:16px;}
  }
</style>
</head>
<body>

<header class="top">
  <h1>Torneo 12 Parejas</h1>
  <p>El Club Espinal · 4 grupos de 3 · 2 canchas</p>
  <nav class="tabs">
    <button data-tab="partidos" class="active">Partidos</button>
    <button data-tab="clasificacion">Clasificación</button>
    <button data-tab="eliminatorias">Eliminatorias</button>
    <button data-tab="pagos">Pagos</button>
  </nav>
</header>

<main>
  <section id="view-partidos" class="view active"></section>
  <section id="view-clasificacion" class="view"></section>
  <section id="view-eliminatorias" class="view"></section>
  <section id="view-pagos" class="view"></section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ---------- Firebase ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyAl3mtoAILvDECAF5XtYg2alPnNSP66Ri8",
  authDomain: "torneo-ley.firebaseapp.com",
  databaseURL: "https://torneo-ley-default-rtdb.firebaseio.com",
  projectId: "torneo-ley",
  storageBucket: "torneo-ley.firebasestorage.app",
  messagingSenderId: "202554467520",
  appId: "1:202554467520:web:2a98f0aa70db5eb6e9b925"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const ROOT = "torneo12parejas"; // nodo propio, no pisa otros torneos

/* ---------- Datos del torneo ---------- */
const GROUP_COLOR = { A:"var(--groupA)", B:"var(--groupB)", C:"var(--groupC)", D:"var(--groupD)" };

const TEAMS = {
  t1:{group:"A", label:"Cabezas / Sacer", players:["Cabezas","Sacer"]},
  t2:{group:"A", label:"Mati A / Sebas Segura", players:["Mati A","Sebas Segura"]},
  t3:{group:"A", label:"Mono A / Andrés Alvarado", players:["Mono A","Andrés Alvarado"]},
  t4:{group:"B", label:"Toy / Hela", players:["Toy","Hela"]},
  t5:{group:"B", label:"José / Suárez", players:["José","Suárez"]},
  t6:{group:"B", label:"Andrade / Andrade", players:["Andrade 1","Andrade 2"]},
  t7:{group:"C", label:"Andrés B / Jean", players:["Andrés B","Jean"]},
  t8:{group:"C", label:"Melo / Santi Segura", players:["Melo","Santi Segura"]},
  t9:{group:"C", label:"Diegose / Mogollón", players:["Diegose","Mogollón"]},
  t10:{group:"D", label:"JP / Parodi", players:["JP","Parodi"]},
  t11:{group:"D", label:"Pecas / Sabogal", players:["Pecas","Sabogal"]},
  t12:{group:"D", label:"Sebastián / Andrés", players:["Sebastián","Andrés"]},
};

const MATCHES = [
  {id:"m1", num:1, group:"A", court:1, time:"4:00 PM", a:"t1", b:"t3"},
  {id:"m2", num:2, group:"B", court:2, time:"4:00 PM", a:"t5", b:"t6"},
  {id:"m3", num:3, group:"A", court:1, time:"4:25 PM", a:"t1", b:"t2"},
  {id:"m4", num:4, group:"B", court:2, time:"4:25 PM", a:"t4", b:"t6"},
  {id:"m5", num:5, group:"A", court:1, time:"4:50 PM", a:"t2", b:"t3"},
  {id:"m6", num:6, group:"B", court:2, time:"4:50 PM", a:"t4", b:"t5"},
  {id:"m7", num:7, group:"C", court:1, time:"5:15 PM", a:"t7", b:"t8"},
  {id:"m8", num:8, group:"D", court:2, time:"5:15 PM", a:"t10", b:"t11"},
  {id:"m9", num:9, group:"C", court:1, time:"5:40 PM", a:"t8", b:"t9"},
  {id:"m10", num:10, group:"D", court:2, time:"5:40 PM", a:"t11", b:"t12"},
  {id:"m11", num:11, group:"C", court:1, time:"6:05 PM", a:"t7", b:"t9"},
  {id:"m12", num:12, group:"D", court:2, time:"6:05 PM", a:"t10", b:"t12"},
];

const PLAYOFF_DEF = {
  qf: [
    {id:"qf1", label:"Cuartos 1", a:{type:"group",group:"A",pos:1}, b:{type:"group",group:"B",pos:2}},
    {id:"qf2", label:"Cuartos 2", a:{type:"group",group:"B",pos:1}, b:{type:"group",group:"A",pos:2}},
    {id:"qf3", label:"Cuartos 3", a:{type:"group",group:"C",pos:1}, b:{type:"group",group:"D",pos:2}},
    {id:"qf4", label:"Cuartos 4", a:{type:"group",group:"D",pos:1}, b:{type:"group",group:"C",pos:2}},
  ],
  sf: [
    {id:"sf1", label:"Semifinal 1", a:{type:"winner",stage:"qf",match:"qf1"}, b:{type:"winner",stage:"qf",match:"qf3"}},
    {id:"sf2", label:"Semifinal 2", a:{type:"winner",stage:"qf",match:"qf2"}, b:{type:"winner",stage:"qf",match:"qf4"}},
  ],
  final: [
    {id:"f1", label:"Final", a:{type:"winner",stage:"sf",match:"sf1"}, b:{type:"winner",stage:"sf",match:"sf2"}},
  ],
};

const PLAYERS = [];
Object.entries(TEAMS).forEach(([tid,t])=>{
  t.players.forEach((name,i)=> PLAYERS.push({id:`${tid}_${i}`, name, teamId:tid, group:t.group}));
});

/* ---------- Estado local ---------- */
let data = { matches:{}, playoffs:{qf:{},sf:{},final:{}}, payments:{}, manualOrder:{} };
let editing = new Set(); // ids en modo edición (solo en memoria)

/* ---------- Firebase listeners ---------- */
onValue(ref(db, `${ROOT}/matches`), snap => { data.matches = snap.val() || {}; renderAll(); });
onValue(ref(db, `${ROOT}/playoffs`), snap => { data.playoffs = snap.val() || {qf:{},sf:{},final:{}}; renderAll(); });
onValue(ref(db, `${ROOT}/payments`), snap => { data.payments = snap.val() || {}; renderAll(); });
onValue(ref(db, `${ROOT}/manualOrder`), snap => { data.manualOrder = snap.val() || {}; renderAll(); });

/* ---------- Helpers ---------- */
function matchState(path){
  const parts = path.split("/"); // e.g. matches/m1  or playoffs/qf/qf1
  let node = data;
  for(const p of parts) node = (node && node[p]) || {};
  return { scoreA: node.scoreA ?? null, scoreB: node.scoreB ?? null, sealed: !!node.sealed, live: !!node.live };
}
function writeState(path, patch){
  update(ref(db, `${ROOT}/${path}`), patch);
}

function groupStandingsRaw(group){
  const teamIds = Object.entries(TEAMS).filter(([id,t])=>t.group===group).map(([id])=>id);
  const stats = {};
  teamIds.forEach(id=> stats[id] = {teamId:id, pg:0, gf:0, gc:0, dif:0, played:0});
  const groupMatches = MATCHES.filter(m=>m.group===group);
  groupMatches.forEach(m=>{
    const st = matchState(`matches/${m.id}`);
    if(!st.sealed || st.scoreA===null || st.scoreB===null) return;
    const sa = Number(st.scoreA), sb = Number(st.scoreB);
    stats[m.a].gf += sa; stats[m.a].gc += sb; stats[m.a].played++;
    stats[m.b].gf += sb; stats[m.b].gc += sa; stats[m.b].played++;
    if(sa>sb) stats[m.a].pg++; else if(sb>sa) stats[m.b].pg++;
  });
  Object.values(stats).forEach(s=> s.dif = s.gf - s.gc);
  return stats;
}
function h2hWinner(group, idA, idB){
  const m = MATCHES.find(mm=> mm.group===group && ((mm.a===idA&&mm.b===idB)||(mm.a===idB&&mm.b===idA)));
  if(!m) return null;
  const st = matchState(`matches/${m.id}`);
  if(!st.sealed || st.scoreA===null || st.scoreB===null) return null;
  const sa=Number(st.scoreA), sb=Number(st.scoreB);
  if(sa===sb) return null;
  const winner = sa>sb ? m.a : m.b;
  return winner===idA ? idA : idB;
}
function getStandings(group){
  const stats = groupStandingsRaw(group);
  const manual = data.manualOrder[group];
  let order;
  if(manual && manual.length===3){
    order = manual.slice();
  } else {
    order = Object.keys(stats).sort((idA,idB)=>{
      const a=stats[idA], b=stats[idB];
      if(a.pg!==b.pg) return b.pg-a.pg;
      if(a.dif!==b.dif) return b.dif-a.dif;
      if(a.gf!==b.gf) return b.gf-a.gf;
      const h2h = h2hWinner(group, idA, idB);
      if(h2h) return h2h===idA ? -1 : 1;
      return 0;
    });
  }
  // detectar empate real entre el 2do y 3er lugar (lo que definiría el clasificado)
  let tie = false;
  if(!manual){
    for(let i=0;i<order.length-1;i++){
      const a=stats[order[i]], b=stats[order[i+1]];
      if(a.pg===b.pg && a.dif===b.dif && a.gf===b.gf && !h2hWinner(group, order[i], order[i+1])){
        tie = true;
      }
    }
  }
  return { order, stats, tie, manual: !!manual };
}

function resolveSlot(slot){
  if(slot.type==="group"){
    const {order} = getStandings(slot.group);
    const allSealed = MATCHES.filter(m=>m.group===slot.group).every(m=> matchState(`matches/${m.id}`).sealed);
    if(!allSealed) return null;
    return order[slot.pos-1] || null;
  }
  if(slot.type==="winner"){
    const st = matchState(`playoffs/${slot.stage}/${slot.match}`);
    if(!st.sealed || st.scoreA===null || st.scoreB===null || st.scoreA===st.scoreB) return null;
    const def = PLAYOFF_DEF[slot.stage].find(x=>x.id===slot.match);
    const teamA = resolveSlot(def.a), teamB = resolveSlot(def.b);
    return Number(st.scoreA) > Number(st.scoreB) ? teamA : teamB;
  }
  return null;
}
function slotLabel(slot){
  if(slot.type==="group") return `${slot.pos}° Grupo ${slot.group}`;
  if(slot.type==="winner") return `Ganador ${PLAYOFF_DEF[slot.stage].find(x=>x.id===slot.match).label}`;
  return "?";
}

/* ---------- Render: Partidos ---------- */
function matchCard(m, path){
  const st = matchState(path);
  const teamA = TEAMS[m.a], teamB = TEAMS[m.b];
  const isEditing = editing.has(m.id);
  const winnerA = st.sealed && st.scoreA!==null && Number(st.scoreA)>Number(st.scoreB);
  const winnerB = st.sealed && st.scoreB!==null && Number(st.scoreB)>Number(st.scoreA);
  return `
  <div class="match ${st.live?'live':''}" style="--gcolor:${GROUP_COLOR[m.group]}">
    <div class="match-head">
      <span class="tag">Grupo ${m.group} · P${m.num}</span>
      <button class="live-btn ${st.live?'on':''}" data-action="live" data-path="${path}" data-live="${st.live?0:1}">EN VIVO</button>
    </div>
    <div class="teams">
      ${teamRow(teamA.label, st.scoreA, isEditing, path, "A", winnerA)}
      ${teamRow(teamB.label, st.scoreB, isEditing, path, "B", winnerB)}
    </div>
    <div class="match-actions">
      ${isEditing
        ? `<button class="btn btn-save" data-action="save" data-path="${path}" data-mid="${m.id}">Guardar</button>`
        : `<button class="btn btn-edit" data-action="edit" data-mid="${m.id}">${st.sealed?'Editar':'Anotar'}</button>`}
    </div>
  </div>`;
}
function teamRow(name, score, isEditing, path, side, isWinner){
  const inputId = `${path.replace(/\//g,'-')}-${side}`;
  return `
  <div class="team-row ${isWinner?'winner':''}">
    <span class="name">${name}</span>
    ${isEditing
      ? `<input class="score-box" type="number" inputmode="numeric" min="0" max="9" id="${inputId}" value="${score ?? ''}" placeholder="-">`
      : `<span class="score-display">${score ?? '–'}</span>`}
  </div>`;
}

function renderPartidos(){
  const el = document.getElementById("view-partidos");
  const slotsBlock1 = [
    {time:"4:00 PM", ids:["m1","m2"]},
    {time:"4:25 PM", ids:["m3","m4"]},
    {time:"4:50 PM", ids:["m5","m6"]},
  ];
  const slotsBlock2 = [
    {time:"5:15 PM", ids:["m7","m8"]},
    {time:"5:40 PM", ids:["m9","m10"]},
    {time:"6:05 PM", ids:["m11","m12"]},
  ];
  const renderBlock = (title, sub, slots) => `
    <div class="block-title"><h2>${title}</h2><span>${sub}</span></div>
    <div class="schedule-scroll"><div class="schedule-inner">
      <div class="court-header">
        <div></div>
        <div class="ch-label">Cancha 1</div>
        <div class="ch-label">Cancha 2</div>
      </div>
      ${slots.map(s=>{
        const sorted = s.ids.map(id=>MATCHES.find(mm=>mm.id===id)).sort((a,b)=>a.court-b.court);
        return `
        <div class="slot-row">
          <div class="slot-time"><b>${s.time}</b></div>
          ${sorted.map(m=> matchCard(m, `matches/${m.id}`)).join("")}
        </div>`;
      }).join("")}
    </div></div>
  `;
  el.innerHTML =
    renderBlock("Bloque 1", "Grupos A y B", slotsBlock1) +
    renderBlock("Bloque 2", "Grupos C y D", slotsBlock2) +
    `<p class="note">Toca “Anotar” para habilitar el marcador y “Guardar” para asegurarlo. Mientras no lo edites, el resultado queda protegido y no se puede borrar por accidente.</p>`;
}

/* ---------- Render: Clasificación ---------- */
function renderClasificacion(){
  const el = document.getElementById("view-clasificacion");
  el.innerHTML = ["A","B","C","D"].map(group=>{
    const {order, stats, tie, manual} = getStandings(group);
    const rows = order.map((tid,i)=>{
      const s = stats[tid];
      return `<tr class="${i<2?'qualify':''}">
        <td>${i+1}</td>
        <td class="name">${TEAMS[tid].label}</td>
        <td class="tabular">${s.played}</td>
        <td class="tabular">${s.pg}</td>
        <td class="tabular">${s.gf}</td>
        <td class="tabular">${s.gc}</td>
        <td class="tabular">${s.dif>0?'+':''}${s.dif}</td>
      </tr>`;
    }).join("");
    return `
    <div class="group-block">
      <div class="group-head"><span class="group-dot" style="--gcolor:${GROUP_COLOR[group]}"></span><h3>Grupo ${group}</h3></div>
      <table class="standings">
        <thead><tr><th>#</th><th style="text-align:left">Pareja</th><th>PJ</th><th>PG</th><th>GF</th><th>GC</th><th>DIF</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${tie ? `<div class="tie-warning">Empate entre los puestos 2 y 3 — no se resuelve con partidos ganados, diferencia de games, games a favor ni enfrentamiento directo. Define el orden por sorteo.</div>` : ""}
      ${(tie||manual) ? manualOrderControls(group, order) : ""}
    </div>`;
  }).join("") + `<p class="note">Criterio de clasificación: 1) partidos ganados · 2) diferencia de games · 3) games a favor · 4) enfrentamiento directo · 5) sorteo.</p>`;
}
function manualOrderControls(group, currentOrder){
  const teamIds = Object.entries(TEAMS).filter(([id,t])=>t.group===group).map(([id])=>id);
  const opts = pos => teamIds.map(id=>`<option value="${id}" ${currentOrder[pos]===id?'selected':''}>${TEAMS[id].label}</option>`).join("");
  return `
  <div class="manual-order">
    <span style="font-size:11.5px;color:var(--text-dim);">Orden por sorteo:</span>
    <select data-action="manual-pos" data-group="${group}" data-pos="0">${opts(0)}</select>
    <select data-action="manual-pos" data-group="${group}" data-pos="1">${opts(1)}</select>
    <select data-action="manual-pos" data-group="${group}" data-pos="2">${opts(2)}</select>
    <button class="btn btn-edit" data-action="clear-manual" data-group="${group}">↺ Automático</button>
  </div>`;
}

/* ---------- Render: Eliminatorias ---------- */
function playoffCard(def, stage){
  const path = `playoffs/${stage}/${def.id}`;
  const teamAId = resolveSlot(def.a), teamBId = resolveSlot(def.b);
  const labelA = teamAId ? TEAMS[teamAId].label : slotLabel(def.a);
  const labelB = teamBId ? TEAMS[teamBId].label : slotLabel(def.b);
  const st = matchState(path);
  const isEditing = editing.has(def.id);
  const ready = teamAId && teamBId;
  const winnerA = st.sealed && st.scoreA!==null && Number(st.scoreA)>Number(st.scoreB);
  const winnerB = st.sealed && st.scoreB!==null && Number(st.scoreB)>Number(st.scoreA);
  return `
  <div class="match ${st.live?'live':''}" style="--gcolor:var(--accent)">
    <div class="match-head">
      <span class="tag">${def.label}</span>
      <button class="live-btn ${st.live?'on':''}" data-action="live" data-path="${path}" data-live="${st.live?0:1}" ${ready?'':'disabled'}>EN VIVO</button>
    </div>
    <div class="teams">
      ${teamRow(labelA, st.scoreA, isEditing && ready, path, "A", winnerA)}
      ${teamRow(labelB, st.scoreB, isEditing && ready, path, "B", winnerB)}
    </div>
    ${ready ? `<div class="match-actions">
      ${isEditing
        ? `<button class="btn btn-save" data-action="save" data-path="${path}" data-mid="${def.id}">Guardar</button>`
        : `<button class="btn btn-edit" data-action="edit" data-mid="${def.id}">${st.sealed?'Editar':'Anotar'}</button>`}
    </div>` : `<p style="color:var(--text-dim);font-size:11.5px;margin:8px 0 0;">Pendiente de definir</p>`}
  </div>`;
}
function renderEliminatorias(){
  const el = document.getElementById("view-eliminatorias");
  el.innerHTML = `
    <div class="stage-title"><h3>Cuartos de final</h3></div>
    <div class="bracket-col">${PLAYOFF_DEF.qf.map(d=>playoffCard(d,"qf")).join("")}</div>
    <div class="stage-title"><h3>Semifinal</h3></div>
    <div class="bracket-col">${PLAYOFF_DEF.sf.map(d=>playoffCard(d,"sf")).join("")}</div>
    <div class="stage-title"><h3>Final</h3></div>
    <div class="bracket-col">${PLAYOFF_DEF.final.map(d=>playoffCard(d,"final")).join("")}</div>
  `;
}

/* ---------- Render: Pagos ---------- */
function renderPagos(){
  const el = document.getElementById("view-pagos");
  const paidCount = PLAYERS.filter(p=>data.payments[p.id]).length;
  const groups = ["A","B","C","D"];
  el.innerHTML = `
    <div class="pay-summary">
      <div><div style="font-size:12px;color:var(--text-dim);">Inscripciones pagadas</div><div class="num">${paidCount} / ${PLAYERS.length}</div></div>
    </div>
    ${groups.map(g=>{
      const players = PLAYERS.filter(p=>p.group===g);
      return `<div class="pay-group">
        <h3><span class="group-dot" style="--gcolor:${GROUP_COLOR[g]}"></span> Grupo ${g}</h3>
        <div class="pay-list">
          ${players.map(p=>{
            const paid = !!data.payments[p.id];
            return `<label class="pay-row ${paid?'paid':''}">
              <input type="checkbox" data-action="pay" data-pid="${p.id}" ${paid?'checked':''}>
              <span>${p.name} <span class="team-of">· ${TEAMS[p.teamId].label}</span></span>
            </label>`;
          }).join("")}
        </div>
      </div>`;
    }).join("")}
  `;
}

function renderAll(){
  renderPartidos();
  renderClasificacion();
  renderEliminatorias();
  renderPagos();
}

/* ---------- Eventos ---------- */
document.addEventListener("click", e=>{
  const btn = e.target.closest("[data-action]");
  if(!btn) return;
  const action = btn.dataset.action;

  if(action==="edit"){
    editing.add(btn.dataset.mid);
    renderAll();
  }
  else if(action==="save"){
    const path = btn.dataset.path;
    const base = path.replace(/\//g,'-');
    const inA = document.getElementById(`${base}-A`);
    const inB = document.getElementById(`${base}-B`);
    const scoreA = inA.value===""? null : Number(inA.value);
    const scoreB = inB.value===""? null : Number(inB.value);
    writeState(path, { scoreA, scoreB, sealed: scoreA!==null && scoreB!==null });
    editing.delete(btn.dataset.mid);
  }
  else if(action==="live"){
    writeState(btn.dataset.path, { live: Number(btn.dataset.live)===1 });
  }
  else if(action==="clear-manual"){
    update(ref(db, `${ROOT}/manualOrder`), { [btn.dataset.group]: null });
  }
});
document.addEventListener("change", e=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  if(el.dataset.action==="pay"){
    writeState(`payments`, { [el.dataset.pid]: el.checked });
  }
  else if(el.dataset.action==="manual-pos"){
    const group = el.dataset.group;
    const {order} = getStandings(group);
    const teamIds = Object.entries(TEAMS).filter(([id,t])=>t.group===group).map(([id])=>id);
    const current = (data.manualOrder[group] && data.manualOrder[group].length===3) ? data.manualOrder[group].slice() : order.slice();
    current[Number(el.dataset.pos)] = el.value;
    update(ref(db, `${ROOT}/manualOrder`), { [group]: current });
  }
});

document.querySelectorAll("nav.tabs button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    document.getElementById(`view-${btn.dataset.tab}`).classList.add("active");
  });
});

renderAll();
</script>
</body>
</html>
